# Pubblica una Release quando si crea un tag "v1.2.3": compila il portable, ne allega lo zip
# e ne genera un'attestazione di provenienza (prova firmata che quel binario viene da questo
# commit e da questa build, verificabile con: gh attestation verify <file> --repo <owner>/<repo>).
# L'installer Inno va allegato a mano (Inno Setup non e' preinstallato sui runner).
name: release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write
  id-token: write        # serve all'attestazione (Sigstore)
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Compila (portable single-file)
        run: .\build.ps1 -SoloPortable
        shell: pwsh

      - name: Attestazione di provenienza
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/portable/Sonda.exe

      - name: Impronte SHA-256
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist -Filter *.zip | ForEach-Object {
              "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          $lines += "$((Get-FileHash dist/portable/Sonda.exe -Algorithm SHA256).Hash.ToLower())  Sonda.exe"
          $lines | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Crea la Release e allega i file
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Sonda-*-portable.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
