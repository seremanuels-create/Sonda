# Pubblica una Release quando si crea un tag "v1.2.3".
#
# Tutto quello che finisce nella Release viene compilato QUI, non su un PC personale, e porta
# un'attestazione di provenienza firmata (Sigstore): chiunque puo' verificare che il binario
# scaricato e' uscito da questo repository e da questo commit, con
#     gh attestation verify <file> --repo <owner>/<repo>
name: release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write
  id-token: write        # serve all'attestazione (Sigstore)
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Installa Inno Setup (per l'installer)
        run: choco install innosetup --no-progress -y
        shell: pwsh

      - name: Compila portable e installer
        run: .\build.ps1
        shell: pwsh

      - name: Attestazione di provenienza (eseguibile e installer)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            dist/portable/Sonda.exe
            dist/Sonda-*-Setup.exe

      - name: Impronte SHA-256
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist -File -Include *.zip, *.exe -Recurse | Where-Object { $_.DirectoryName -eq (Resolve-Path dist).Path })
          $files += Get-Item dist/portable/Sonda.exe
          $files | ForEach-Object {
              "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Crea la Release e allega i file
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Sonda-*-portable.zip
            dist/Sonda-*-Setup.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
